name: Auto-assign

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    if: vars.ISSUE_ASSIGNEE != ''
    runs-on: ubuntu-latest
    steps:
      - name: Assign configured user
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ASSIGNEE: ${{ vars.ISSUE_ASSIGNEE }}
        with:
          script: |
            const assignee = process.env.ASSIGNEE;
            if (!assignee) {
              core.setFailed("Set the repository variable ISSUE_ASSIGNEE to enable auto-assignment.");
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [assignee],
            });
